[language]
name = "DQL"
grammar = "dql"
path_suffixes = ["dql"]
line_comments = ["// "]
block_comment = false
tab_size = 2
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
]
autoclose_before = ")];,"
