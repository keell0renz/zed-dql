[language]
name = "DQL-SN"
grammar = "dql"
path_suffixes = ["dqlsn"]
line_comments = ["// "]
block_comment = false
tab_size = 2
hard_tabs = false
brackets = [
  { start = "[", end = "]", close = true, newline = false },
  { start = "|", end = "|", close = false, newline = false },
]
autoclose_before = "],"
